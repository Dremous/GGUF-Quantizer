name: Build & Push Image

on:
  schedule:
    - cron: "0 0 * * 0"           # 每周日自动重建
  workflow_dispatch:              # 支持手动触发
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # 允许推送 GHCR 包

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and date
        id: image
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 每次构建都使用最新官方预编译：取最新“已发布”的 bXXXX 标签注入 LLAMA_CPP_RELEASE，
      # 标签每次变化令 Docker 层缓存失效 → 真正重新下载最新 llama-quantize。
      # 用带 GITHUB_TOKEN 认证的 gh api（不占未认证限流额度），且只统计已发布 release，
      # 避免选到“标签已推送但资产尚未发布”的版本。
      - name: 获取最新 llama.cpp 发布标签
        id: llama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LLAMA_CPP_RELEASE=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=10" \
            --jq '[ .[].tag_name | select(test("^b[0-9]+$")) ] | sort_by(ltrimstr("b")|tonumber) | last')
          echo "LLAMA_CPP_RELEASE=${LLAMA_CPP_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "latest published llama.cpp release = ${LLAMA_CPP_RELEASE}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 每次构建注入 APP_VERSION 与最新 bXXXX 标签（后者强制重新下载最新预编译包）
          build-args: |
            APP_VERSION=${{ steps.image.outputs.DATE }}-${{ steps.image.outputs.SHORT_SHA }}
            LLAMA_CPP_RELEASE=${{ steps.llama.outputs.LLAMA_CPP_RELEASE }}
          # gha 缓存：系统依赖/apt/npm 层复用加速；llama 下载层因 LLAMA_CPP_RELEASE 变化而失效 → 每次重新下载
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.DATE }}
            ghcr.io/${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.DATE }}-${{ steps.image.outputs.SHORT_SHA }}

      - name: 构建失败通知
        if: failure()
        env:
          # 可选：配置仓库 secret WEBHOOK_URL（飞书/企业微信/钉钉机器人地址）即可推送失败告警
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          echo "::error::GGUF-Quantizer 镜像构建失败（run #${{ github.run_number }}）"
          if [ -n "$WEBHOOK_URL" ]; then
            curl -fsS -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"GGUF-Quantizer 镜像构建失败 run#${{ github.run_number }}\"}}" || true
          fi
