<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GGUF Quantizer</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171e26;
    --panel-2: #1d2631;
    --border: #2a3644;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #10b981;      /* emerald */
    --accent-soft: rgba(16, 185, 129, .14);
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 14px;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 20% -10%, #16202b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }

  header { margin-bottom: 26px; }
  header .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #10b981, #0ea5a4);
    display: grid; place-items: center; font-weight: 800; font-size: 18px;
    color: #04120d; box-shadow: 0 6px 20px rgba(16,185,129,.35);
  }
  header h1 { margin: 0; font-size: 24px; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .badge {
    margin-left: auto; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); background: var(--panel);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .badge.ok .dot { background: var(--accent); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px;
  }
  .step {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-weight: 700; font-size: 15px;
  }
  .step .num {
    width: 24px; height: 24px; border-radius: 8px; background: var(--accent-soft);
    color: var(--accent); display: grid; place-items: center; font-size: 13px;
  }
  .step small { color: var(--muted); font-weight: 400; margin-left: 4px; }

  /* Upload */
  #drop {
    border: 1.5px dashed var(--border); border-radius: 12px; padding: 30px 20px;
    text-align: center; cursor: pointer; transition: .15s; background: var(--panel-2);
  }
  #drop:hover, #drop.drag { border-color: var(--accent); background: var(--accent-soft); }
  #drop .ic { font-size: 30px; margin-bottom: 6px; }
  #drop p { margin: 4px 0; color: var(--muted); font-size: 13.5px; }
  #drop b { color: var(--text); }
  #drop input { display: none; }

  .filebar {
    display: none; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
  }
  .filebar.show { display: flex; }
  .filebar .meta { flex: 1; min-width: 0; }
  .filebar .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filebar .dim { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .filebar .ok { color: var(--accent); font-size: 20px; }

  /* Controls */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  label.field { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
  select, input[type=text] {
    width: 100%; padding: 11px 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    font-size: 14px; outline: none; transition: .15s;
  }
  select:focus, input[type=text]:focus { border-color: var(--accent); }
  select optgroup { background: var(--panel); }
  #typeDesc { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }

  .btn {
    border: 0; border-radius: 10px; padding: 12px 20px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: .15s; font-family: inherit;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #04120d; width: 100%; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--muted); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid #4a2a2a; }
  .btn-danger:hover:not(:disabled) { border-color: var(--danger); }

  /* Job */
  #jobCard { display: none; }
  #jobCard.show { display: block; }
  .job-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .status {
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .status.queued { background: rgba(139,152,165,.18); color: var(--muted); }
  .status.running { background: var(--accent-soft); color: var(--accent); }
  .status.done { background: rgba(16,185,129,.2); color: var(--accent); }
  .status.error { background: rgba(248,113,113,.16); color: var(--danger); }
  .status.cancelled { background: rgba(251,191,36,.16); color: var(--warn); }

  .bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; border-radius: 999px; }
  .bar.indet > div {
    width: 35% !important; animation: slide 1.2s ease-in-out infinite;
    background: linear-gradient(90deg, var(--accent), #0ea5a4);
  }
  @keyframes slide { 0%{margin-left:-35%} 100%{margin-left:100%} }

  pre#log {
    background: #0b0f14; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    color: #b8c4ce; margin: 14px 0 0;
  }
  .job-actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  .job-actions .spacer { flex: 1; }
  .download {
    display: none; background: var(--accent); color: #04120d; text-decoration: none;
    padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 14px;
  }
  .download.show { display: inline-block; }
  .err { color: var(--danger); font-size: 13.5px; margin-top: 10px; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo">GQ</div>
      <div>
        <h1>GGUF Quantizer</h1>
        <div class="sub">上传 FP16 GGUF → 选择量化参数 → 下载量化结果（基于 llama.cpp）</div>
      </div>
      <span class="badge" id="health"><span class="dot"></span>连接中…</span>
    </div>
  </header>

  <!-- Step 1 -->
  <div class="card">
    <div class="step"><span class="num">1</span>上传 FP16 GGUF <small>.gguf</small></div>
    <div id="drop">
      <div class="ic">⬆</div>
      <p><b>点击或拖拽文件到此</b></p>
      <p>仅接受 FP16（float16 类型）的 GGUF 模型文件</p>
      <input type="file" id="fileInput" accept=".gguf" />
    </div>
    <div class="filebar" id="filebar">
      <span class="ok">✓</span>
      <div class="meta">
        <div class="name" id="fname"></div>
        <div class="dim" id="fsize"></div>
      </div>
    </div>
  </div>

  <!-- Step 2 -->
  <div class="card">
    <div class="step"><span class="num">2</span>选择量化参数</div>
    <div class="grid">
      <div>
        <label class="field">量化类型</label>
        <select id="typeSelect"></select>
        <div id="typeDesc"></div>
      </div>
      <div>
        <label class="field">输出文件名（可选）</label>
        <input type="text" id="outName" placeholder="自动生成，如 model-q4_K_M.gguf" />
      </div>
    </div>
    <div style="margin-top:18px">
      <button class="btn btn-primary" id="quantBtn" disabled>开始量化</button>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="card" id="jobCard">
    <div class="step"><span class="num">3</span>量化进度与结果</div>
    <div class="job-head">
      <span class="status" id="jobState">-</span>
      <span style="color:var(--muted);font-size:13px" id="jobMeta"></span>
    </div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
    <pre id="log"></pre>
    <div class="err" id="err"></div>
    <div class="job-actions">
      <button class="btn btn-danger" id="cancelBtn" style="display:none">取消</button>
      <div class="spacer"></div>
      <a class="download" id="dlBtn" href="#">下载量化结果 ⬇</a>
    </div>
  </div>

  <footer>GGUF Quantizer · llama.cpp llama-quantize</footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let uploadId = null, jobId = null, logOffset = 0, pollTimer = null;

// ---------- 量化类型 ----------
let typeMeta = null;
async function loadTypes() {
  const r = await fetch("/api/quant-types");
  typeMeta = await r.json();
  const sel = $("typeSelect");
  for (const [gid, label] of Object.entries(typeMeta.groups)) {
    const og = document.createElement("optgroup");
    og.label = label;
    for (const [name, [desc, grp, rec]] of Object.entries(typeMeta.types)) {
      if (grp !== gid) continue;
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name + (rec ? " ★" : "");
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.value = typeMeta.default;
  showTypeDesc();
}
function showTypeDesc() {
  const name = $("typeSelect").value;
  const [desc] = typeMeta.types[name];
  $("typeDesc").textContent = desc;
  const stem = $("fname").textContent.replace(/\.gguf$/i, "") || "model";
  $("outName").placeholder = stem + "-" + name + ".gguf";
}

// ---------- 健康检查 ----------
async function health() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    const b = $("health");
    b.classList.add("ok");
    b.innerHTML = '<span class="dot"></span>量化器就绪 · 可用磁盘 ' + h.disk_free_gib + ' GiB';
  } catch (e) {
    $("health").innerHTML = '<span class="dot"></span>服务异常';
  }
}

// ---------- 上传 ----------
const drop = $("drop"), fileInput = $("fileInput");
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("drag");
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

async function uploadFile(file) {
  if (!/\.gguf$/i.test(file.name)) { alert("仅接受 .gguf 文件"); return; }
  const fd = new FormData();
  fd.append("file", file);
  $("quantBtn").disabled = true;
  try {
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "上传失败");
    uploadId = j.upload_id;
    $("fname").textContent = j.filename;
    $("fsize").textContent = (j.size_gib) + " GiB";
    $("filebar").classList.add("show");
    $("quantBtn").disabled = false;
    showTypeDesc();
  } catch (e) {
    alert(e.message);
  }
}

// ---------- 量化 ----------
$("typeSelect").addEventListener("change", showTypeDesc);
$("quantBtn").addEventListener("click", async () => {
  if (!uploadId) return;
  const body = {
    upload_id: uploadId,
    quant_type: $("typeSelect").value,
    output_name: $("outName").value.trim() || null,
    source_name: $("fname").textContent
  };
  const r = await fetch("/api/quantize", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const j = await r.json();
  if (!r.ok) { alert(j.detail); return; }
  jobId = j.job_id;
  logOffset = 0;
  $("log").textContent = "";
  $("err").textContent = "";
  $("jobCard").classList.add("show");
  $("quantBtn").disabled = true;
  $("cancelBtn").style.display = "inline-block";
  $("dlBtn").classList.remove("show");
  poll();
  pollTimer = setInterval(poll, 1500);
});

async function poll() {
  if (!jobId) return;
  const r = await fetch("/api/jobs/" + jobId + "?offset=" + logOffset);
  const j = await r.json();
  const state = j.state;

  const st = $("jobState");
  st.className = "status " + state;
  st.textContent = state;

  $("jobMeta").textContent = j.output_name + " · " + j.quant_type;

  if (j.log && j.log.length) {
    const pre = $("log");
    pre.textContent += j.log.join("\n") + "\n";
    pre.scrollTop = pre.scrollHeight;
    logOffset = j.log_total;
  }

  const fill = $("barFill");
  if (state === "running") {
    $("bar").classList.add("indet");
  } else {
    $("bar").classList.remove("indet");
    fill.style.width = (j.progress || 0) + "%";
  }

  if (state === "done") {
    $("dlBtn").href = "/api/jobs/" + jobId + "/download";
    $("dlBtn").classList.add("show");
    $("quantBtn").disabled = false;
    $("cancelBtn").style.display = "none";
    stopPoll();
  } else if (state === "error") {
    $("err").textContent = j.error || "量化失败，请查看上方日志。";
    $("quantBtn").disabled = false;
    $("cancelBtn").style.display = "none";
    stopPoll();
  } else if (state === "cancelled") {
    $("quantBtn").disabled = false;
    $("cancelBtn").style.display = "none";
    stopPoll();
  }
}

function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

$("cancelBtn").addEventListener("click", async () => {
  if (!jobId) return;
  await fetch("/api/jobs/" + jobId + "/cancel", { method: "POST" });
  $("cancelBtn").disabled = true;
});

// ---------- init ----------
loadTypes();
health();
</script>
</body>
</html>
